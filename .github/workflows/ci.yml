name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if node -e "
              const { Client } = require('pg');
              const client = new Client({ connectionString: process.env.DATABASE_URL });
              client.connect()
                .then(() => client.end())
                .then(() => process.exit(0))
                .catch(() => process.exit(1));
            "; then
              echo "Postgres ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - run: pnpm typecheck

      - run: pnpm lint

      - name: Enable Postgres extensions
        run: |
          node -e "
            const { Client } = require('pg');
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            client.connect()
              .then(() => client.query('CREATE EXTENSION IF NOT EXISTS vector;'))
              .then(() => client.end())
              .catch((error) => { console.error(error); process.exit(1); });
          "

      - run: pnpm db:setup

      - run: pnpm build

      - name: Build GitHub Pages export
        run: pnpm build:pages
        env:
          NEXT_PUBLIC_SITE_URL: https://jiaxiantao.github.io/knowledge-studio

  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build GitHub Pages export
        run: pnpm build:pages
        env:
          NEXT_PUBLIC_SITE_URL: https://jiaxiantao.github.io/knowledge-studio
